name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the Windows portable exe
        required: false
        type: string
        default: v0.1.9-beta
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable build
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Build Windows portable app
        run: npm run dist:win

      - name: Write Windows release metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path dist/desktop -Filter '*.exe' | Select-Object -First 1
          if (-not $asset) {
            throw "No Windows portable exe was built."
          }

          $hash = (Get-FileHash -Path $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($asset.FullName).sha256"
          "$hash  $($asset.Name)" | Set-Content -Path $checksumPath -Encoding ascii

          $manifest = [ordered]@{
            schema = "galaid.windowsReleaseAsset.v1"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            repository = $env:GITHUB_REPOSITORY
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            releaseTag = $env:RELEASE_TAG
            commit = $env:GITHUB_SHA
            refName = $env:GITHUB_REF_NAME
            asset = [ordered]@{
              name = $asset.Name
              size = $asset.Length
              sha256 = $hash
              checksumName = "$(Split-Path -Leaf $checksumPath)"
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path "$($asset.FullName).release.json" -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: GalAid-windows-portable
          path: |
            dist/desktop/*.exe
            dist/desktop/*.exe.sha256
            dist/desktop/*.exe.release.json
          if-no-files-found: error

      - name: Publish Windows release asset
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path dist/desktop -Filter '*.exe' | Select-Object -First 1
          if (-not $asset) {
            throw "No Windows portable exe was built."
          }
          $checksumPath = "$($asset.FullName).sha256"
          if (-not (Test-Path $checksumPath)) {
            throw "No Windows checksum file was built."
          }
          $checksum = Get-Item $checksumPath
          $manifestPath = "$($asset.FullName).release.json"
          if (-not (Test-Path $manifestPath)) {
            throw "No Windows release manifest was built."
          }
          $manifest = Get-Item $manifestPath

          if (-not $env:RELEASE_TAG) {
            Write-Host "No release tag was provided; skipping release upload."
            exit 0
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseCreateArgs = @(
              "release",
              "create",
              $env:RELEASE_TAG,
              "--repo",
              $env:GITHUB_REPOSITORY,
              "--title",
              "GalAid $($env:RELEASE_TAG)",
              "--generate-notes"
            )

            if ($env:RELEASE_TAG -match "(?i)(alpha|beta|rc)") {
              $releaseCreateArgs += "--prerelease"
            }

            & gh @releaseCreateArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub release $($env:RELEASE_TAG)."
            }
          }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $assetNamesToKeep = @($asset.Name, $checksum.Name, $manifest.Name)
          foreach ($item in $release.assets) {
            if (($item.name -like 'GalAid-*-win-x64.exe' -or $item.name -like 'GalAid-*-win-x64.exe.sha256' -or $item.name -like 'GalAid-*-win-x64.exe.release.json') -and ($assetNamesToKeep -notcontains $item.name)) {
              gh release delete-asset $env:RELEASE_TAG $item.name -y --repo $env:GITHUB_REPOSITORY
            }
          }

          gh release upload $env:RELEASE_TAG $asset.FullName $checksum.FullName $manifest.FullName --clobber --repo $env:GITHUB_REPOSITORY
